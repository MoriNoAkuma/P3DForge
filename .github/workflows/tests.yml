name: Tests

on:
  # pull requests are tested by pull_request; push only for main, otherwise each PR commit runs twice
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build P3DForge.sln -c Release

      - name: Test
        run: dotnet test tests/P3DForge.Core.Tests -c Release --no-build
