name: Build release

# Publishing a release on GitHub (tag like v0.1.0) builds P3DForge.exe and attaches it to that release.
# "Run workflow" on the Actions tab builds it too and keeps it as a downloadable artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = if ($tag) { $tag.TrimStart('v') } else { "0.0.0-dev" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build P3DForge.exe (one file, no .NET install needed)
        run: >
          dotnet publish src/P3DForge.App/P3DForge.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:GenerateDocumentationFile=false -p:Version=${{ steps.version.outputs.version }}
          -o out

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path out/P3DForge.exe -DestinationPath P3DForge-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/P3DForge.exe "P3DForge-${{ steps.version.outputs.version }}-win-x64.zip" --clobber

      - name: Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: P3DForge-${{ steps.version.outputs.version }}-win-x64
          path: out/P3DForge.exe
